name: Save yesterday's grid

on:
  schedule:
    # 11:20 UTC is 6:20 AM EST / 7:20 AM EDT, after NYISO posts the full day
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new days and rebuild rollups
        run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "grid-symphony-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: $(ls data/days | tail -1 | cut -d. -f1)"
            git push
          fi
